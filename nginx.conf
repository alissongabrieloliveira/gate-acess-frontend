# SPA fallback: sem isso, recarregar a página numa rota como
# /reports/audit-logs devolveria 404 do Nginx (só existe index.html de
# verdade no disco — o roteamento de react-router-dom é client-side).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
